# application.properties
# Role: server + PostgreSQL configuration.

# Web server port (Android's RetrofitClient points at this port)
server.port=8080

# --- PostgreSQL connection ---
# Database "logindb" must exist (see db/init.sql).
# Change username/password to match your local PostgreSQL install.
spring.datasource.url=jdbc:postgresql://localhost:5432/logindb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# "update" = Hibernate creates/updates the users table automatically to match
# the User entity. Fine for a demo; real projects use migrations (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update

# Print the SQL Hibernate runs, so you can SEE the SELECT during login.
spring.jpa.show-sql=true
